name: CI

# G3. This workflow is not a formality: there is no Docker on the development
# machine, so GitHub Actions is the ONLY way this project gets container images
# at all. Tier B of the reproduction story is gated on it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Tier A -- full pipeline, no Docker, no license
    runs-on: ubuntu-latest
    env:
      # MKL picks its pivoting by thread count, and the shared runners have been
      # failing LU factorization with a divide-by-zero at thread counts we do not
      # control. Pin to one thread: the DEVSIM solves here are small, so the cost
      # is nil and the factorization is deterministic.
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_THREADING_LAYER: "SEQUENTIAL"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The devsim wheel ships no BLAS on Linux either; a bare ubuntu-latest has
      # none of libopenblas/liblapack/libblas and `import devsim` dies with
      # RuntimeError. Debian ships the unversioned symlink only in the -dev package.
      - name: Install BLAS for DEVSIM
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libopenblas-dev

      - name: Sync the environment
        run: uv sync --extra snn --extra devsim --group dev --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Run the suite
        run: uv run pytest -v

      - name: G2 -- DEVSIM converges a pn diode
        # Deliberately a separate process from anything that imports torch: both
        # link Intel OpenMP and the second to initialise aborts the interpreter.
        run: uv run python tests/g2_devsim_diode.py

      - name: G4 -- extraction smoothness gate
        run: uv run pytest tests/test_g4_smoothness.py -v

  build:
    name: Build and push ${{ matrix.tesseract }}
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # T1 (sentaurus-fefet) is built too, even though the flagship runs
        # uncontainerised against a remote license. An uncontainerised Tesseract
        # with no image reads as "did not containerise"; see docs/T1_CONTAINER.md.
        tesseract: [devsim-fefet, adjoint-shim, snn-lif-ecg, sentaurus-fefet, mock-oracle]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the Tesseract SDK
        run: uv sync --frozen

      - name: Build
        id: build
        run: |
          set -euo pipefail
          uv run tesseract build tesseracts/${{ matrix.tesseract }} \
            --tag ci-${GITHUB_SHA::12} | tee build.json
          echo "image=${{ matrix.tesseract }}:ci-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the built image
        run: |
          docker run --rm ${{ steps.build.outputs.image }} check

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SRC=${{ steps.build.outputs.image }}
          for TAG in "ci-${GITHUB_SHA::12}" latest; do
            DEST=$REGISTRY/$OWNER/${{ matrix.tesseract }}:$TAG
            docker tag "$SRC" "$DEST"
            docker push "$DEST"
            # Pin by digest in the writeup, not by tag: `latest` is a moving target
            # and Tier B has to be reproducible a month from now.
            docker inspect --format='{{index .RepoDigests 0}}' "$DEST" || true
          done

  check-gradients:
    name: V3 -- the organizers' own gradient checker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync the environment
        run: uv sync --extra snn --group dev --frozen

      - name: check-gradients on the adjoint shim
        # rtol is loosened from the default 0.10 to 0.15 because the shim's
        # Jacobian IS a finite difference: comparing it against another finite
        # difference cannot agree more closely than the two truncation errors
        # allow. eps is set to the shim's own step so the two agree on scale.
        # --max-evals 8 is what makes this the 56-check run the notes describe:
        # theta is the only differentiated input, so n_evals passes straight
        # through and 8 x 7 outputs = 56. Without it the default of 1000 asks
        # for 7000 checks and the budget dies partway.
        # Measured 30 Aug: 0 failures / 56 checks. V2 on D3 reports the full
        # cosine-vs-staleness curve rather than leaning on a threshold.
        env:
          ORACLE_BACKEND: mock
          TESSERACT_API_PATH: tesseracts/adjoint-shim/tesseract_api.py
          # check-gradients probes the oracle far more than an optimisation
          # step does, and the shim's 65-call cap is sized for the latter.
          # The cap is meant to be raised deliberately; this is that.
          SHIM_MAX_ORACLE_CALLS: "100000"
          # A point-wise gradient checker assumes the VJP is a pure function of
          # theta, evaluated with the same stencil as its own reference. The
          # shim is neither by default, for good reasons: it reuses J across
          # steps (that reuse IS the economic argument, measured in V2) and it
          # refreshes with forward differences, which cost D probes where
          # central costs 2D. Against a central reference the forward estimate
          # is off by the truncation gap alone -- 20-50% on ss and dg_dvth,
          # whose Jacobian entries move by a factor of 12 across one alpha.
          # These three put the shim in the regime the checker assumes. NONE of
          # them changes a default, so no banked result moves; they cost solver
          # calls, which is why they are not on in the first place.
          SHIM_ALWAYS_CENTRAL: "1"
          SHIM_REFRESH_EVERY: "1"
          SHIM_TRUST_RADIUS: "1e-12"
        run: |
          uv run python scripts/make_check_payload.py > payload.json
          uv run tesseract-runtime check-gradients @payload.json \
            --endpoints vector_jacobian_product \
            --max-evals 8 \
            --eps 0.02 --rtol 0.15 --seed 0

      # The payload sets smooth_spikes=True. Finite-differencing a Heaviside gives
      # either exactly zero or one spike-flip, so a hard spiking forward pass cannot
      # be gradient-checked by anyone; the smooth relaxation IS the function the
      # surrogate is the exact derivative of. Measured on D1: 0 failures / 10 checks.
      - name: check-gradients on the spiking network
        env:
          TESSERACT_API_PATH: tesseracts/snn-lif-ecg/tesseract_api.py
        run: |
          # T4 reads the MIT-BIH beats, and this repository does not ship them:
          # they are the thesis' own preprocessing of a public database and this
          # repo is public. Same reason Figure 4 cannot be redrawn from a clean
          # clone. Without the data there is nothing to gradient-check, so say so
          # in the log rather than failing on a precondition CI cannot meet.
          if [ -z "${DIFFSILICON_ECG_DIR:-}" ]; then
            echo "::notice title=V3 spiking network::SKIPPED -- the MIT-BIH beats are not in this repository. Set DIFFSILICON_ECG_DIR on a machine that has them to run this check."
            exit 0
          fi
          uv run python scripts/make_check_payload.py --snn > payload_snn.json
          uv run tesseract-runtime check-gradients @payload_snn.json \
            --endpoints vector_jacobian_product \
            --eps 1e-6 --rtol 0.10 --seed 0

  tier-b:
    name: Tier B -- the pipeline against the container a judge pulls
    runs-on: ubuntu-latest
    # `build` and not `test`, because this job pulls `latest` off GHCR and on a
    # push to main `build` is what puts the current commit's image there. With
    # `needs: test` the two race and this job tests the previous image.
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # No `--extra devsim`, and that is the claim, not an oversight: with the
      # solver in a container the host does not need DEVSIM, BLAS, or a licence.
      # Nothing here can import a solver even if it wanted to.
      - name: Sync the environment
        run: uv sync --extra snn --group dev --frozen

      # No docker login step anywhere in this job. The runner pulls the way an
      # unauthenticated judge pulls, so a package that quietly went private
      # fails here instead of in front of them.
      - name: Pull the published image, anonymously
        run: |
          set -euo pipefail
          docker logout ghcr.io || true
          docker pull ghcr.io/hozaifa1/devsim-fefet:latest
          docker image inspect --format='{{index .RepoDigests 0}}' ghcr.io/hozaifa1/devsim-fefet:latest

      # The same three variables the Tier A job pins, for the same measured
      # reason: MKL picks its pivoting by thread count, and on a shared runner
      # the thread count is not ours to control. Without them the container
      # loads a solver, runs Newton to 1e-13, and then dies inside LU
      # factorization with "floating point exception of type Invalid,
      # Divide-by-zero". These solves are small, so one thread costs nothing and
      # the factorization becomes deterministic.
      - name: Serve it
        run: |
          set -euo pipefail
          uv run tesseract serve ghcr.io/hozaifa1/devsim-fefet:latest --port 8101 -e MKL_NUM_THREADS=1 -e OMP_NUM_THREADS=1 -e MKL_THREADING_LAYER=SEQUENTIAL -e DIFFSILICON_CACHE_ROOT=/tmp/diffsilicon-cache -e DIFFSILICON_PROVENANCE_LOG=/tmp/diffsilicon-provenance.jsonl
          for _ in $(seq 60); do
            curl -sf http://localhost:8101/health && break
            sleep 2
          done
          curl -sf http://localhost:8101/health

      - name: Tier B -- schema over the wire, no mock fallback, gradient through the hop
        env:
          ORACLE_URL: http://localhost:8101
        run: uv run pytest tests/test_tier_b_served.py -v

      # A Tesseract that fails inside `apply` answers HTTP 500 and keeps the
      # traceback in the container. Without this the log shows only the 500.
      - name: What the container said
        if: failure()
        run: docker ps -a --format '{{.ID}} {{.Image}}' | awk '{print $1}' | xargs -r -n1 docker logs --tail 200

      - name: Tear it down
        if: always()
        run: uv run tesseract teardown --all || true
