[project]
name = "diffsilicon"
version = "0.1.0"
description = "Backpropagating an ECG classification loss through a spiking network, a subthreshold neuron circuit, and a closed-source commercial TCAD solver."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.13"
authors = [{ name = "Hozaifa" }]

dependencies = [
    "tesseract-core[runtime]>=1.11.0",
    "tesseract-jax>=0.4.1",
    "jax[cpu]>=0.4.35",
    "optax>=0.2.4",
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
snn = ["torch>=2.4", "wfdb>=4.1", "scikit-learn>=1.5"]
# The Windows devsim wheel ships no BLAS/LAPACK and no MKL, and refuses to import
# without one. See diffsilicon.shared.devsim_env. Linux wheels are self-contained.
devsim = ["devsim>=2.10", "mkl>=2024.0; sys_platform == 'win32'"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
    # ADDED 2026-08-29 (D6). Every scripts/fig*.py imports matplotlib, and the
    # README tells a reader to run them to regenerate the figures from the
    # committed cache. It was declared nowhere, so a clean clone died on
    # `ModuleNotFoundError: No module named 'matplotlib'` -- found by the D8
    # clean-clone dry run, pulled forward to D6.
    "matplotlib>=3.8",
]

# Keep torch CPU-only. The default Linux wheel drags in ~2.5 GB of CUDA runtime,
# which nothing here uses: the SNN is a 2-layer LIF on CPU, and CI has to build
# and push three container images in the same job.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diffsilicon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --timeout=600"
markers = [
    "slow: long-running tests",
    "needs_devsim: requires the devsim package",
    "needs_license: requires the Sentaurus license/host",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
